<style>
@font-face{font-family:es;font-style:normal;font-weight:400;src:url(/_nuxt/es.3jk7KDMC.woff2) format("woff2")}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#d1ccc6;color:#111;font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
.hdr{display:flex;justify-content:space-between;align-items:center;padding:28px 48px;position:sticky;top:0;background:#d1ccc6ee;backdrop-filter:blur(6px);z-index:9}
.hdr a{color:#111;text-decoration:none}
.hdr .brand{font-family:es,sans-serif;font-weight:700;font-size:20px;letter-spacing:.02em}
.hdr nav a{margin-left:24px;font-size:14px}
.wrap{max-width:1080px;margin:0 auto;padding:0 32px}
.hero{padding:90px 0 60px}
.hero h1{font-family:es,sans-serif;font-size:clamp(56px,9vw,128px);line-height:.95;letter-spacing:-.02em}
.hero h1 .sub{display:block;color:#fff;position:relative;width:fit-content}
.hero h1 .sub::after{content:"";position:absolute;left:0;bottom:6px;width:100%;height:.16em;background:#ffe800;z-index:-1}
.hero p{margin-top:28px;font-size:15px;color:#333}
.tbl{background:#0d0d0d;color:#eee;border-radius:28px;padding:64px 0;margin:40px 0 80px}
.tbl .row{display:grid;grid-template-columns:220px 1fr;gap:16px;padding:22px 48px;border-bottom:1px solid #2a2a2a;max-width:900px;margin:0 auto;align-items:center}
.tbl .row:last-child{border-bottom:none}
.tbl .k{color:#ffe800;font-size:13px;letter-spacing:.14em;font-family:es,sans-serif;text-transform:uppercase}
.tbl .v{font-size:15px;line-height:1.9}
.ftr{padding:48px;display:flex;justify-content:space-between;font-size:12px;color:#555}
.ftr a{color:#555}
@media(max-width:640px){.tbl .row{grid-template-columns:1fr;gap:4px;padding:18px 24px}.hdr{padding:20px 24px}}
</style></head><body>
<header class="hdr"><a class="brand" href="/">Sendai Logic</a>
<nav><a href="/recruit">採用情報</a><a href="/contact">お問い合わせ</a></nav></header>
<div class="wrap">
<section class="hero">
<h1>Company<span class="sub">&amp;Profile</span></h1>
</section>
</div>
<div class="wrap"><section class="tbl">

<div class="row"><div class="k">Representative</div><div class="v">代表取締役　松本 悠吾</div></div>
<div class="row"><div class="k">Sendai HQ</div><div class="v">宮城県仙台市青葉区中央2-11-19 仙南ビル4階-A</div></div>
<div class="row"><div class="k">Tokyo HQ</div><div class="v">東京都港区海岸1-2-20</div></div>
<div class="row"><div class="k">Business</div><div class="v">SES事業</div></div>
<div class="row"><div class="k">Contact</div><div class="v"><a href="mailto:contact@sendai-logic.com" style="color:#ffe800">contact@sendai-logic.com</a></div></div>
</section></div>
<footer class="ftr"><span>Sendai Logic © 2026</span><a href="/privacy">プライバシーポリシー</a></footer>
